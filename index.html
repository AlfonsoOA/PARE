<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0F1114">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="PARE">
  <meta name="description" content="PARE — Pain and Reward. Entrenamiento, dieta y progreso. Earn your reward.">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icono.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icono-180.png">
  <title>PARE</title>
  <style>
    html, body { margin: 0; background: #0F1114; color: #F2F3F5; font-family: system-ui, sans-serif; }
    #arranque { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 24px; box-sizing: border-box; text-align: center; }
    #arranque img { width: 96px; height: 96px; }
    #arranque p { margin: 0; color: #A3A9B3; max-width: 34ch; line-height: 1.4; }
    #arranque button { font: inherit; font-weight: 700; background: #3CC8E6; color: #0F1114; border: 0; border-radius: 12px; padding: 14px 20px; }
    #arranque code { font-size: 12px; color: #F5A524; word-break: break-word; }
  </style>
</head>
<body>
  <div id="app"><div id="arranque"><img src="./icono.svg" alt="PARE"><p id="arranque-txt">Cargando PARE…</p></div></div>
  <script>
    // Red de seguridad: si la app no arranca en 12 s (navegador antiguo, versión a medio actualizar…), lo dice y ofrece repararlo.
    (function () {
      var errores = [];
      window.addEventListener('error', function (e) { errores.push(e.message || (e.target && e.target.src) || 'error'); }, true);
      window.addEventListener('unhandledrejection', function (e) { errores.push(String(e.reason)); });
      window.__pareReparar = function () {
        var p = [];
        if (navigator.serviceWorker) p.push(navigator.serviceWorker.getRegistrations().then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister(); })); }));
        if (window.caches) p.push(caches.keys().then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k); })); }));
        Promise.all(p).catch(function () {}).then(function () { location.reload(); });
      };
      setTimeout(function () {
        var t = document.getElementById('arranque-txt');
        if (!t) return; // la app ya está montada
        t.innerHTML = 'PARE no ha terminado de cargar. Pulsa el botón para descargar la versión nueva (tus datos no se borran).';
        var b = document.createElement('button'); b.textContent = 'Reparar y recargar'; b.onclick = window.__pareReparar;
        t.parentNode.appendChild(b);
        if (errores.length) { var c = document.createElement('code'); c.textContent = errores.slice(0, 3).join(' · ') + ' · ' + navigator.userAgent; t.parentNode.appendChild(c); }
      }, 12000);
    })();
  </script>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
