# Publica PARE en GitHub Pages cada vez que se sube algo a main.
name: Publicar PARE
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Recetario maestro: si se ha subido un Excel a datos/recetario/entrada, se aplica y se guarda en el repositorio
      - name: Recetario maestro
        run: node scripts/recetario-maestro.mjs
      - name: Guardar el recetario actualizado
        run: |
          if [ -n "$(git status --porcelain datos)" ]; then
            git config user.name "PARE (recetario)"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A datos
            git commit -m "Recetario maestro actualizado desde el Excel subido"
            git push
          fi
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  publicar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - id: despliegue
        uses: actions/deploy-pages@v4
